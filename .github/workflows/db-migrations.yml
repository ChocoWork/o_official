name: Deploy DB migrations

# 本番 Supabase へのスキーマ適用。
#
# 以前の実装は `for f in migrations/*.sql; do psql -f "$f"; done` で、適用済み台帳が無く
# 毎回全ファイルを頭から流していた。全 migration が冪等でないと壊れるうえ、
# psql は文ごとに autocommit するため CREATE FUNCTION と REVOKE の間に
# PUBLIC EXECUTE の窓ができる。Supabase CLI の db push へ寄せて両方を解消する。
# 適用済みは supabase_migrations.schema_migrations で判定されるためスキップされる。

# 2026-11-16: push の引き金を止めた。`supabase db push` は未適用の移行を全部流すので、
# パスキーの段3まで動かさない。本番へは調整役が MCP の `apply_migration` で1本ずつ当てる。
# `deploy` の job は手動の入口として残すが、使わない決まり（docs/06_Operations/db-migrations.md）。
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch: {}

permissions:
  contents: read

# 同時適用を避ける。キャンセルはしない（適用途中で止めない）。
concurrency:
  group: db-migrations
  cancel-in-progress: false

jobs:
  plan:
    name: Dry run (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required secret $name is not set."
              exit 1
            fi
          done

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # 適用されるものを一覧するだけ。DB は変更しない。
      - run: supabase db push --dry-run

  deploy:
    name: Apply to production
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required secret $name is not set."
              exit 1
            fi
          done

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # 何が当たるかをログに残してから適用する（事故時の追跡用）。
      - run: supabase db push --dry-run

      - run: supabase db push

      # 参考情報。ここが落ちても本体の成否を上書きしない（失敗時に
      # 二重にエラーが出て、本当の原因が読み取りにくくなるため）。
      - name: Show applied migration history
        if: always()
        continue-on-error: true
        run: supabase migration list
