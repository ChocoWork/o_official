name: Typecheck

on:
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: typecheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Run npm run typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsconfig.json は src / e2e / tests をすべて include するので、
      # 本番コードだけでなくテストの型崩れもここで落とす。
      - name: Run typecheck
        run: npm run typecheck
